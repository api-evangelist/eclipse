description: 'Entity-relationship graph for the Eclipse Foundation API surface, computed from the $ref links between
  components.schemas in the published contracts. There is NO single shared data model: the surface is a federation of
  independently modelled domains that share identifiers by convention rather than by schema. The same real-world entity
  is modelled separately in several specifications — an Eclipse account appears as `User` in Open VSX, `UserProfile`
  in the Profile API, `Committer` in the Projects PMI API and `UserInfo` in the Membership Portal API, with no $ref between
  them.'
