  write_operations_excluded: Deliberately none of the 83 mutating operations is sketched as a tool. Only 2 of them
    carry any replay or concurrency control and none publishes a reversal window, so an unattended agent should not
    be given a write tool against this surface until that changes. See the idempotency and reversibility blocks in
    conventions/eclipse-conventions.yml.
recommendation_to_provider: A read-only MCP server over the Projects PMI, Open VSX registry and Newsroom APIs would
  be inexpensive to build — all three are anonymous, JSON, and already specified in OpenAPI — and would make the Foundation's
  own project and extension data directly addressable by agents. The contracts to generate it from are already published;
  only the server is missing.
