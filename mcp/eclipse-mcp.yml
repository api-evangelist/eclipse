description: The Eclipse Foundation ships no MCP server for its own API surface. An agent that wants to read Eclipse
  project, marketplace, newsroom or Open VSX registry data must call the REST APIs directly. The tool list below is
  a CANDIDATE derivation from published operationIds, offered as a starting point for anyone building such a server
  — it is not a server that exists, and no endpoint may be inferred from it.
search_findings:
- No hosted MCP endpoint is published on any Eclipse host. mcp.eclipse.org does not exist, and no /mcp path is served
  on api.eclipse.org, open-vsx.org, marketplace.eclipse.org or projects.eclipse.org.
- No npm, PyPI or other registry package provides an MCP server for the Eclipse Web APIs.
- IMPORTANT DISAMBIGUATION. Several Eclipse Foundation PROJECTS implement MCP, and none of them is an MCP surface
  onto the Foundation's own APIs. Eclipse GLSP lets a graphical language server act as an MCP server for diagram editing;
  Eclipse LMOS (Arc Framework) both consumes MCP tools and can act as an MCP server for agent workflows; eclipse-agents
  runs an MCP server inside the Eclipse IDE JVM; the Eclipse IDE supports connecting GitHub Copilot to MCP servers.
  All four are software the Foundation stewards for other people to run, not an agent door onto api.eclipse.org. Treating
  any of them as this provider's MCP server would be wrong.
- A third-party "AssistAI" listing on marketplace.eclipse.org exposes the Eclipse IDE as an MCP server. It is a community
  plugin, not a Foundation-operated service.
candidate_tools:
  note: 'Derived tool sketches only. Each names the real published operation it would wrap, by operationId where the
    specification declares one and by METHOD + path where it does not. The input schema of each tool would be that
    operation''s parameters. No tool below has ever been served. NOTE: 4 of the 18 published specifications (Newsroom,
    Downloads, GeoIP, Project Adopters) declare NO operationId on any operation, so those tools can only be bound
    positionally — which is itself a barrier to generating an MCP server from these contracts.'
