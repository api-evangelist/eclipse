- version: v1.1.0
  date: '2026-08-02'
  name: v1.1.0
  line: server
  breaking: false
  url: https://github.com/eclipse-openvsx/openvsx/releases/tag/v1.1.0
  highlights:
  - Upgrade to use Spring Boot 4
  - Upgrade to use Vite 8 to build the frontend
  - Redesign of the Web UI
  - Support for immutable extension versions
- version: webui-1.1.0
  date: '2026-08-02'
  name: Frontend Library v1.1.0
  line: webui
  breaking: false
  url: https://github.com/eclipse-openvsx/openvsx/releases/tag/webui-1.1.0
  highlights:
  - Add a home page with hero search, popular searches, a category browser, curated extension rows and get-involved
    cards
  - Add a dedicated search page under `/search` with query, category, sort field and sort order synced to the URL
  - Add global keyboard shortcuts
  - 'Add keyboard navigation of search results: `↑`/`↓`'
- version: cli-1.1.0
  date: '2026-08-02'
  name: CLI v1.1.0
  line: cli
  breaking: false
  url: https://github.com/eclipse-openvsx/openvsx/releases/tag/cli-1.1.0
  highlights:
  - Add an encrypted filestore as fallback to the system keychain if it cant be accessed ([#1950](https://github.com/eclipse/openvsx/pull/1950))
  - Add `--allow-missing-repository` option to the `publish` command, passed on to `vsce` to package an extension
    whose `package.json` has no `repository` field without asking for confirmation ([#1735](https://github.com/eclipse-openvsx/openvsx/issues/1735))
  - Replace `keytar` with `cross-keychain` to store credentials in the system keychain ([#1950](https://github.com/eclipse/openvsx/pull/1950))
  - Mask token input when using `login` command ([#1966](https://github.com/eclipse-openvsx/openvsx/pull/1966)
