- version: webui-1.1.1
  date: '2026-08-09'
  name: Frontend Library v1.1.1
  line: webui
  breaking: false
  url: https://github.com/eclipse-openvsx/openvsx/releases/tag/webui-1.1.1
  highlights:
  - 'Fix the WebUI build failing on s390x and ppc64le: use postcss instead of lightningcss (no ppc64le binary) for
    CSS, and bump vite for the Rolldown big-endian sourcemap fix ([#2051](https://github.com/eclipse-openvsx/openvsx/issues/2051))'
  - Fix the admin publisher revoke dialog prompting for an Eclipse login even when the target publisher's agreement
    status is `none` or could not be determined (nothing confirmed to revoke)
  - Remove the unused `@mui/base` dependency; it is deprecated upstream (replaced by `@base-ui/react`) and nothing
    in the codebase imports from it
  - Bump socks from `2.8.3` to `2.8.9`
- version: cli-1.1.1
  date: '2026-08-09'
  name: CLI v1.1.1
