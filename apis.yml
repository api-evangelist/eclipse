aid: eclipse
name: Eclipse Foundation
description: 'The Eclipse Foundation is a non-profit (Belgian AISBL) that provides a global community
  of individuals and organizations with a mature, scalable and business-friendly environment for open
  source software collaboration and innovation. It is also a substantial API provider in its own right:
  it publishes 294 REST operations across 18 first-party OpenAPI specifications, covering Eclipse project
  and release metadata (Projects PMI), the Eclipse Marketplace, the Eclipse Newsroom, Foundation downloads
  and GeoIP, Eclipse Contributor Agreement validation, committer paperwork and document signing, mailing
  lists, member organizations and working groups, Eclipse account profiles, and the Eclipse Open VSX Registry
  — the vendor-neutral marketplace for VS Code-compatible extensions, which also implements the Microsoft
  VS Code Extension Gallery wire protocol. Read access across the entire surface is anonymous, unmetered
  and free; writes authenticate against Keycloak OpenID Connect on auth.eclipse.org or, for Open VSX publishing,
  a personal access token.'
type: Index
deliveryModel:
  model: saas
  open_source: true
  commercial: false
  callable_host: true
  label: Hosted service · open source · you call their endpoint
  confidence: high
