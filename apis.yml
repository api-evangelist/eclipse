  generated: '2026-09-07'
  method: searched
  note: 'Corrected 2026-09-07 from a derived "freemium / public: false" reading. Every read operation
    across the 294 published operations is anonymous — no account, no key, no signup, no meter — and the
    Eclipse Foundation publishes no API plans or prices at all (plan_count 0). Writes require a free eclipse.org
    account.'
