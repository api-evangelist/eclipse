  note: Corrected 2026-09-07. The Eclipse Foundation is a non-profit AISBL, not a commercial vendor; the
    APIs are free and their implementations are published under EPL-2.0 on gitlab.eclipse.org/eclipsefdn
    and github.com/eclipse-openvsx. Open VSX is additionally self-hostable, and its own CLI targets any
    deployment via OVSX_REGISTRY_URL.
