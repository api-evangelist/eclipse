- aid: eclipse:eclipse-eclipse-uss-api
  name: Eclipse Foundation Eclipse USS API
  description: "The Eclipse User Storage Service (USS) allows Eclipse projects to store user-specific\
    \ project information on the \nEclipse Foundation servers. The goal is to make it easy for our projects\
    \ to offer a \nbetter user experience by storing relevant information in a central location.\n\nThe\
    \ BLOB resource is a way for projects to store binary objects based off a application_token/key value\
    \ pair.\n\nThe “value” is always the last element in this JSON structure. All other things must come\
    \ before that so that \nthe SDK implementation can parse and collect them into a Map and finally return\
    \ a decoding InputStream to \ndeliver the “value” content back to the caller/application. The blob\
    \ value is available when the \nclient retrieve a specific blob using an application_token and key.\n\
    \nWe are using application_token and key to identify a blob. The Application token is a string that\
    \ is assigned by the \nEclipse Management Organization.The key string must respect the following validation\
    \ rules:\n\n* 5-25 characters;\n\n* letters: lowercase and uppercase/numbers/underscores are valid;\n\
