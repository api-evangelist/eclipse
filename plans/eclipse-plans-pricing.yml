description: >-
  Plans and pricing for the Eclipse Foundation API surface. There are none. The Eclipse Foundation
  is a non-profit that publishes its 294 API operations across api.eclipse.org,
  marketplace.eclipse.org, newsroom.eclipse.org, projects.eclipse.org, membership.eclipse.org and
  open-vsx.org at no charge, with no metering, no tiers, no signup for read access and no
  commercial API product. This artifact replaces a 2026-05-04 scaffold that invented a
  "eclipse-free" freemium tier with a 1,000 requests/month quota — no such tier, quota or price
  has ever been published by the Eclipse Foundation.
plan_count: 0
plans: []
note: >-
  Verified 2026-09-07 by reading the API specification index, the Open VSX about and terms pages,
  and the Foundation's own funding pages. Nothing on those pages attaches a price, quota or tier to
  API access. The Foundation is funded by corporate membership dues and sponsorship, neither of
  which gates or meters the APIs: a non-member with no account can call every anonymous read
  operation on the surface today.
funding_model:
  type: non-profit-membership
  detail: >-
    Revenue comes from membership classes (Strategic, Contributing, Associate) and sponsorship, not
    from API consumption. Membership buys governance rights and services, not API quota.
  membership: https://www.eclipse.org/membership/
  sponsorship: https://www.eclipse.org/donate/
access_model:
  read_access: anonymous, no account, no key, no charge
  write_access: >-
    Free but authenticated. Open VSX publishing requires a free eclipse.org account and a personal
    access token; Foundation write APIs require an OIDC token from auth.eclipse.org. Neither is
    sold.
  metering: none published
  see: rate-limits/eclipse-rate-limits.yml
