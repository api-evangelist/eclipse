providerId: eclipse
generated: '2026-09-07'
method: searched
source: >-
  https://webdev.eclipse.org/docs/api/, https://www.eclipse.org/membership/,
  https://www.eclipse.org/donate/, https://open-vsx.org/about, https://open-vsx.org/terms-of-use
