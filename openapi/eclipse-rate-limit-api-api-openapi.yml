          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Result'
                - $ref: '#/components/schemas/Extension'
                - $ref: '#/components/schemas/Namespace'
                - $ref: '#/components/schemas/NamespaceMembershipList'
                - $ref: '#/components/schemas/QueryResult'
