openapi: 3.2.0
info:
  termsOfService: https://www.eclipse.org/legal/termsofuse.php
  license:
    name: Eclipse Public License 2.0
    url: https://www.eclipse.org/legal/epl-2.0/
  version: '0.1'
  title: Eclipse Trusted Publishing API
servers:
- url: https://open-vsx.org
  description: Generated server url
tags:
- name: trusted-publishing-api
paths:
  /user/namespace/{namespace}/trusted-publishing/delete/{id}:
    post:
      tags:
      - trusted-publishing-api
      operationId: deleteTrustedPublisher
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Result'
                - $ref: '#/components/schemas/Extension'
                - $ref: '#/components/schemas/Namespace'
                - $ref: '#/components/schemas/NamespaceMembershipList'
                - $ref: '#/components/schemas/QueryResult'
                - $ref: '#/components/schemas/ReviewList'
                - $ref: '#/components/schemas/SearchResult'
                - $ref: '#/components/schemas/User'
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
      summary: Delete trusted publisher
      x-summary-source: derived
  /user/namespace/{namespace}/trusted-publishing/create:
    post:
      tags:
      - trusted-publishing-api
      operationId: createTrustedPublisher
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/Result'
              - $ref: '#/components/schemas/Extension'
              - $ref: '#/components/schemas/Namespace'
              - $ref: '#/components/schemas/NamespaceMembershipList'
              - $ref: '#/components/schemas/QueryResult'
              - $ref: '#/components/schemas/ReviewList'
              - $ref: '#/components/schemas/SearchResult'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedPublisherJson'
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
      summary: Create trusted publisher
      x-summary-source: derived
  /api/-/trusted-publishing/token:
    post:
      tags:
      - trusted-publishing-api
      operationId: requestPublishToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedPublisherTokenRequestJson'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenJson'
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
      summary: Request publish token
      x-summary-source: derived
  /user/namespace/{namespace}/trusted-publishing:
    get:
      tags:
      - trusted-publishing-api
      operationId: getTrustedPublishers
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedPublisherListJson'
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
      summary: Get trusted publishers
      x-summary-source: derived
  /api/-/trusted-publishing/status:
    get:
      tags:
      - trusted-publishing-api
      operationId: getTrustedPublishingStatus
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedPublisherStatusJson'
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
      summary: Get trusted publishing status
      x-summary-source: derived
components:
  schemas:
    TrustedPublisherStatusJson:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        enabled:
          type: boolean
          description: Indicates whether the trusted publisher feature is enabled
        allowed:
          type: boolean
          description: Indicates whether the current user is allowed to use the trusted publisher feature
        trustedPublisherProviders:
          type: array
          description: List of supported trusted publisher providers
          items:
            $ref: '#/components/schemas/TrustedPublisherProviderJson'
    ReviewList:
      required:
      - reviews
      type: object
      description: List of reviews of an extension
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          reviews:
            type: array
            items:
              $ref: '#/components/schemas/Review'
    TrustedPublisherJson:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        id:
          type: integer
          format: int64
        namespace:
          type: string
        extension:
          type: string
        provider:
          type: string
        registration:
          type: object
          additionalProperties:
            type: string
        createdTimestamp:
          type: string
    Badge:
      type: object
      properties:
        url:
          type: string
          description: Image URL of the badge
        href:
          type: string
          description: The link users will follow when clicking the badge
        description:
          type: string
      description: A badge to be shown in the sidebar of the extension page in the registry
    ExtensionReplacement:
      type: object
      properties:
        url:
          type: string
          description: URL of the extension replacement
        displayName:
          type: string
          description: Name to be displayed in user interfaces
      description: Metadata of an extension replacement
    SearchEntry:
      required:
      - files
      - name
      - namespace
      - timestamp
      - url
      - verified
      - version
      type: object
      properties:
        url:
          type: string
          description: URL to get the full metadata of the extension
        files:
          type: object
          additionalProperties:
            type: string
            description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
          description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
        name:
          type: string
          description: Name of the extension
        namespace:
          type: string
          description: Namespace of the extension
        version:
          type: string
          description: The latest published version
        timestamp:
          type: string
          description: Date and time when this version was published (ISO-8601)
        verified:
          type: boolean
          description: The value 'true' means the publishing user is a privileged user or the publishing user is a member of the extension's namespace and the namespace has at least one owner.
        allVersions:
          type: array
          description: 'Essential metadata of all available versions. Deprecated: only returns the last 100 versions. Use allVersionsUrl instead.'
          deprecated: true
          items:
            $ref: '#/components/schemas/VersionReference'
        allVersionsUrl:
          type: string
          description: URL to get essential metadata of all available versions.
        averageRating:
          maximum: 5
          minimum: 0
          type: number
          description: Average rating
          format: double
        reviewCount:
          minimum: 0
          type: integer
          description: Number of reviews
          format: int64
        downloadCount:
          minimum: 0
          type: integer
          description: Number of downloads of the extension package
          format: int32
        displayName:
          type: string
          description: Name to be displayed in user interfaces
        description:
          type: string
        deprecated:
          type: boolean
          description: Indicates whether the extension is deprecated
      description: Summary of metadata of an extension
    ExtensionReference:
      required:
      - extension
      - namespace
      - url
      type: object
      properties:
        url:
          type: string
          description: URL to get metadata of the referenced extension
        namespace:
          type: string
          description: Namespace of the referenced extension
        extension:
          type: string
          description: Name of the referenced extension
      description: A reference to another extension in the registry
    Namespace:
      required:
      - name
      - verified
      type: object
      description: Metadata of a namespace
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          name:
            type: string
            description: Name of the namespace
          extensions:
            type: object
            additionalProperties:
              type: string
              description: Map of extension names to their metadata URLs (not required for creating)
            description: Map of extension names to their metadata URLs (not required for creating)
          verified:
            type: boolean
            description: Indicates whether the namespace has an owner (not required for creating)
    TrustedPublisherListJson:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        trustedPublishers:
          type: array
          items:
            $ref: '#/components/schemas/TrustedPublisherJson'
        registrableExtensions:
          type: array
          items:
            type: string
    TrustedPublisherTokenRequestJson:
      type: object
      properties:
        namespace:
          type: string
        extension:
          type: string
        token:
          type: string
    SearchResult:
      required:
      - extensions
      - offset
      - totalSize
      type: object
      description: List of extensions matching a search query
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          offset:
            minimum: 0
            type: integer
            description: Number of skipped entries according to the search query
            format: int32
          totalSize:
            minimum: 0
            type: integer
            description: Total number of entries that match the search query
            format: int32
          extensions:
            type: array
            description: List of matching entries, limited to the size specified in the search query
            items:
              $ref: '#/components/schemas/SearchEntry'
    TargetPlatformActive:
      type: object
      properties:
        targetPlatform:
          type: string
          description: Name of the target platform
          enum:
          - win32-x64
          - win32-ia32
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-armhf
          - alpine-x64
          - alpine-arm64
          - darwin-x64
          - darwin-arm64
          - web
          - universal
        active:
          type: boolean
          description: Whether this extension version for this target platform is active
        removed:
          type: boolean
          description: Whether this extension version for this target platform has been removed (soft-deleted)
      description: Target platform of an extension version and whether it is active
    TrustedPublisherInputJson:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        key:
          type: string
        description:
          type: string
        optional:
          type: boolean
    Review:
      required:
      - rating
      - timestamp
      - user
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        timestamp:
          type: string
          description: Date and time when this review was posted (ISO-8601)
        comment:
          type: string
        rating:
          maximum: 5
          minimum: 0
          type: integer
          description: Number of stars
          format: int32
      description: A review of an extension
    AccessTokenJson:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        id:
          type: integer
          format: int64
        value:
          type: string
        createdTimestamp:
          type: string
        accessedTimestamp:
          type: string
        expiresTimestamp:
          type: string
        notified:
          type: boolean
        description:
          type: string
        deleteTokenUrl:
          type: string
    Result:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
      description: Generic result indicator
    QueryResult:
      required:
      - offset
      - totalSize
      type: object
      description: Metadata query result
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          offset:
            minimum: 0
            type: integer
            description: Number of skipped entries according to the query
            format: int32
          totalSize:
            minimum: 0
            type: integer
            description: Total number of entries that match the query
            format: int32
          extensions:
            type: array
            description: Extensions that match the given query (may be empty)
            items:
              $ref: '#/components/schemas/Extension'
    Extension:
      required:
      - name
      - namespace
      - namespaceDisplayName
      - namespaceUrl
      - publishedBy
      - publishedWithTrustedPublishing
      - reviewsUrl
      - timestamp
      - verified
      - version
      type: object
      description: Metadata of an extension
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          namespaceUrl:
            type: string
            description: URL to get metadata of the extension's namespace
          reviewsUrl:
            type: string
            description: URL to get the list of reviews of this extension
          files:
            type: object
            additionalProperties:
              type: string
              description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
            description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
          name:
            type: string
            description: Name of the extension
          namespace:
            type: string
            description: Namespace of the extension
          targetPlatform:
            type: string
            description: Name of the target platform
            enum:
            - win32-x64
            - win32-ia32
            - win32-arm64
            - linux-x64
            - linux-arm64
            - linux-armhf
            - alpine-x64
            - alpine-arm64
            - darwin-x64
            - darwin-arm64
            - web
            - universal
          version:
            type: string
            description: Selected version, or the latest version if none was specified
          preRelease:
            type: boolean
            description: Indicates whether this is a pre-release version
          publishedBy:
            $ref: '#/components/schemas/User'
          publishedWithTrustedPublishing:
            type: boolean
            description: Indicates whether this version was published using trusted publishing
          reviewStatus:
            type: string
            description: 'Review/publishing status: published (active and visible to all), under_review (being reviewed), rejected (blocked)'
            enum:
            - published
            - under_review
            - rejected
          reviewMessage:
            type: string
            description: Message explaining the review status (e.g., why extension was quarantined or rejected)
          verified:
            type: boolean
            description: The value 'true' means the publishing user is a privileged user or the publishing user is a member of the extension's namespace and the namespace has at least one owner.
          allVersions:
            type: object
            additionalProperties:
              type: string
              description: 'Map of available versions to their metadata URLs. Deprecated: only returns the last 100 versions. Use allVersionsUrl instead.'
              deprecated: true
            description: 'Map of available versions to their metadata URLs. Deprecated: only returns the last 100 versions. Use allVersionsUrl instead.'
            deprecated: true
          allVersionsUrl:
            type: string
            description: URL to get a map of available versions to their metadata URLs.
          averageRating:
            maximum: 5
            minimum: 0
            type: number
            description: Average rating
            format: double
          downloadCount:
            minimum: 0
            type: integer
            description: Number of downloads of the extension package
            format: int32
          reviewCount:
            minimum: 0
            type: integer
            description: Number of reviews
            format: int64
          versionAlias:
            type: array
            description: Available version aliases ('latest' or 'pre-release')
            items:
              type: string
              description: Available version aliases ('latest' or 'pre-release')
          timestamp:
            type: string
            description: Date and time when this version was published (ISO-8601)
          preview:
            type: boolean
            description: Indicates whether this is a preview extension
          displayName:
            type: string
            description: Name to be displayed in user interfaces
          namespaceDisplayName:
            type: string
            description: Namespace name to be displayed in user interfaces
          description:
            type: string
          engines:
            type: object
            additionalProperties:
              type: string
              description: Map of engine names to the respective version constraints
            description: Map of engine names to the respective version constraints
          categories:
            type: array
            items:
              type: string
          extensionKind:
            type: array
            description: A list that indicates where the extension should run in remote configurations. Values are "ui" (run locally), "workspace" (run on remote machine) and "web"
            items:
              type: string
              description: A list that indicates where the extension should run in remote configurations. Values are "ui" (run locally), "workspace" (run on remote machine) and "web"
          tags:
            type: array
            items:
              type: string
          license:
            type: string
            description: License identifier
          homepage:
            type: string
            description: URL of the extension's homepage
          repository:
            type: string
            description: URL of the extension's source repository
          sponsorLink:
            type: string
            description: URL to sponsor the extension
          bugs:
            type: string
            description: URL of the extension's bug tracker
          markdown:
            type: string
            description: Markdown rendering engine to use in user interfaces
            enum:
            - standard
            - github
          galleryColor:
            type: string
            description: CSS color to use as background in user interfaces
          galleryTheme:
            type: string
            description: Theme type for user interfaces
            enum:
            - light
            - dark
          localizedLanguages:
            type: array
            description: Languages the extension has been translated in
            items:
              type: string
              description: Languages the extension has been translated in
          qna:
            type: string
            description: URL of the extension's Q&A page
          badges:
            type: array
            description: List of badges to display in user interfaces
            items:
              $ref: '#/components/schemas/Badge'
          dependencies:
            type: array
            description: List of dependencies to other extensions
            items:
              $ref: '#/components/schemas/ExtensionReference'
          bundledExtensions:
            type: array
            description: List of extensions bundled with this extension
            items:
              $ref: '#/components/schemas/ExtensionReference'
          downloads:
            type: object
            additionalProperties:
              type: string
              description: Map of download links by target platform
            description: Map of download links by target platform
          allTargetPlatformVersions:
            type: array
            description: Map of target platforms by extension version
            items:
              $ref: '#/components/schemas/VersionTargetPlatformsJson'
          url:
            type: string
            description: version metadata URL
          deprecated:
            type: boolean
            description: Indicates whether the extension is deprecated
          replacement:
            $ref: '#/components/schemas/ExtensionReplacement'
          downloadable:
            type: boolean
            description: Whether to show downloads in user interfaces
    VersionTargetPlatformsJson:
      type: object
      properties:
        version:
          type: string
        targetPlatforms:
          type: array
          items:
            $ref: '#/components/schemas/TargetPlatformActive'
        canDelete:
          type: boolean
      description: Map of target platforms by extension version
    VersionReference:
      type: object
      properties:
        url:
          type: string
          description: URL to get the full metadata of this version
        files:
          type: object
          additionalProperties:
            type: string
            description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
          description: Map of file types (download, manifest, icon, readme, license, changelog) to their respective URLs
        version:
          type: string
        targetPlatform:
          type: string
          description: Name of the target platform
          enum:
          - win32-x64
          - win32-ia32
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-armhf
          - alpine-x64
          - alpine-arm64
          - darwin-x64
          - darwin-arm64
          - web
          - universal
        engines:
          type: object
          additionalProperties:
            type: string
            description: Map of engine names to the respective version constraints
          description: Map of engine names to the respective version constraints
      description: Essential metadata of an extension version
    NamespaceMembershipList:
      required:
      - namespaceMemberships
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
