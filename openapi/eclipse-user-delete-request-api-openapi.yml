          total_result_size: '6'
    Error:
      type: array
      items:
        type: string
      description: An array containing a single message indicating the error
    UserDeleteRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - uid
      - name
      - mail
      - host
      - status
      - created
      - changed
      - url
      properties:
        id:
          type: string
          description: The request id
        uid:
          type: string
          description: The user uid
        name:
          type: string
          description: The user's ef username
        mail:
          type: string
          description: The user email
        host:
          type: string
          description: The request host name
        status:
          type: string
          description: The current request status. Ex, 0, 1, or 2
        created:
          type: string
          description: The epoch time stamp of the creation of the request
        changed:
          type: string
          description: The epoch time stamp of the last change made to the request
        url:
          type: string
          description: The URL pointing to the resource
      example:
        id: '1'
        uid: '606609'
        name: zacharysabourin
        mail: zachary.sabourin@eclipse-foundation.org
        host: projects.eclipse.org
        status: '0'
