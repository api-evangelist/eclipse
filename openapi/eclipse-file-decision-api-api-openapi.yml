  version: '0.1'
  title: Eclipse File Decision API
servers:
- url: https://open-vsx.org
  description: Generated server url
tags:
- name: file-decision-api
paths:
  /admin/scans/files/decisions:
    post:
      tags:
      - file-decision-api
      summary: Create or update file decisions
      operationId: makeFileDecisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDecisionRequest'
        required: true
      responses:
        '200':
          description: Decisions processed successfully
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDecisionResponse'
        '400':
          description: Invalid request
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
    delete:
      tags:
      - file-decision-api
      summary: Remove file decisions
      operationId: deleteFileDecisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDecisionDeleteRequest'
        required: true
      responses:
        '200':
          description: Deletions processed successfully
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDecisionDeleteResponse'
        '400':
          description: Invalid request
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/files:
    get:
      tags:
      - file-decision-api
      summary: Get files with admin decisions
      operationId: getFiles
      parameters:
      - name: decision
        in: query
        description: Filter by admin decision type
        required: false
        schema:
          type: string
          enum:
          - allowed
          - blocked
      - name: publisher
        in: query
        description: Filter by publisher name
        required: false
        schema:
          type: string
      - name: namespace
        in: query
        description: Filter by namespace
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filter by display name, extension name, or file name
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: Maximum number of entries to return
        required: false
        schema:
          maximum: 100
          minimum: 0
          type: integer
          default: 18
      - name: offset
        in: query
        description: Number of entries to skip
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          type: string
          default: dateDecided
          enum:
          - dateDecided
          - fileName
          - publisher
          - namespace
      - name: sortOrder
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: dateDecidedFrom
        in: query
        description: Filter files decided on or after this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: dateDecidedTo
        in: query
        description: Filter files decided on or before this date (ISO 8601 format)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of file decisions
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResponse'
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/files/{fileId}:
    get:
      tags:
      - file-decision-api
      summary: Get specific file decision
      operationId: getFileDecision
      parameters:
      - name: fileId
        in: path
        description: File decision ID
        required: true
        schema:
          type: integer
          format: int64
        example: 123
      responses:
        '200':
          description: File decision details
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDecision'
        '404':
          description: File decision not found
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/files/counts:
    get:
      tags:
      - file-decision-api
      summary: Get file decision counts
      operationId: getFileDecisionCounts
      parameters:
      - name: dateDecidedFrom
        in: query
        description: Filter files decided on or after this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: dateDecidedTo
        in: query
        description: Filter files decided on or before this date (ISO 8601 format)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: File decision counts
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDecisionCounts'
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
components:
  schemas:
    FileDecisionResult:
      type: object
      properties:
        fileHash:
          type: string
          description: The file hash that was processed
          example: a3f5c8e9d2b1f4a6
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error message if the operation failed
          example: File hash not found
      description: Individual result for a file decision create/update operation
    FileDecision:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        id:
          type: string
          description: Unique identifier for the file decision
        scanId:
          type: string
          description: ID of the scan that originally flagged this file
        fileName:
          type: string
          description: Path to the file within the extension
        fileHash:
          type: string
          description: SHA256 hash of the file
        fileType:
          type: string
          description: File extension/type
        decision:
          type: string
          description: The admin decision for this file
        decidedBy:
          type: string
          description: Email of the admin who made the decision
        dateDecided:
          type: string
          description: When the decision was made (UTC)
        displayName:
          type: string
          description: Human-readable name of the extension containing this file
        namespace:
          type: string
          description: Extension namespace
        extensionName:
          type: string
          description: Technical name of the extension
        publisher:
          type: string
          description: Publisher name
        version:
          type: string
          description: Extension version when decision was made
      description: File allow/block list decision
    FilesResponse:
      required:
      - files
      - offset
      - totalSize
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        offset:
          minimum: 0
          type: integer
          description: Number of skipped entries
          format: int32
        totalSize:
          minimum: 0
          type: integer
          description: Total number of files matching the query
          format: int32
        files:
          type: array
          description: List of file decisions
          items:
            $ref: '#/components/schemas/FileDecision'
      description: Paginated list of file decisions
    FileDecisionResponse:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        processed:
          type: integer
          description: Total number of file hashes processed
          format: int32
          example: 5
        successful:
          type: integer
          description: Number of decisions applied successfully
          format: int32
          example: 4
        failed:
          type: integer
          description: Number of decisions that failed
          format: int32
          example: 1
        results:
          type: array
          description: Detailed results for each file hash
          items:
            $ref: '#/components/schemas/FileDecisionResult'
      description: Response for file decision create/update operations
    FileDecisionDeleteResult:
      type: object
      properties:
        fileId:
          type: integer
          description: The file ID that was processed
          format: int64
        success:
          type: boolean
          description: Whether the deletion was successful
        error:
          type: string
          description: Error message if the deletion failed
      description: Individual result for a file decision delete operation
    FileDecisionRequest:
      type: object
      properties:
        fileHashes:
          type: array
          description: List of file hashes to apply the decision to
          items:
            type: string
            description: List of file hashes to apply the decision to
        decision:
          type: string
          description: 'Decision to apply: ''allowed'' or ''blocked'''
      description: Request body for creating/updating file decisions
    FileDecisionDeleteRequest:
      type: object
      properties:
        fileIds:
          type: array
          description: List of file IDs to delete
          items:
            type: integer
            description: List of file IDs to delete
            format: int64
      description: Request body for deleting file decisions
    FileDecisionDeleteResponse:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        processed:
          type: integer
          description: Total number of file IDs processed
          format: int32
        successful:
          type: integer
          description: Number of deletions completed successfully
          format: int32
        failed:
          type: integer
          description: Number of deletions that failed
          format: int32
        results:
          type: array
          description: Detailed results for each file ID
          items:
            $ref: '#/components/schemas/FileDecisionDeleteResult'
      description: Response for file decision delete operations
    FileDecisionCounts:
      type: object
      properties:
        success:
          type: string
          description: Indicates success of the operation (omitted if a more specific result type is returned)
        warning:
          type: string
          description: Indicates a warning; when this is present, other properties can still be used
        error:
          type: string
          description: Indicates an error; when this is present, all other properties should be ignored
        allowed:
          type: integer
          description: Total count of allowed files
          format: int32
        blocked:
          type: integer
          description: Total count of blocked files
          format: int32
        total:
          type: integer
          description: Total count of all files
          format: int32
      description: Counts of allowed and blocked files
