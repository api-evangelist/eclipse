  /admin/api/extension/{namespaceName}/{extensionName}/purge:
    post:
      tags:
      - admin-api
      summary: Permanently purge an extension or one or multiple extension versions
      description: Unlike delete, this physically removes the versions from the database and storage, freeing their identities for republishing. Extension versions are otherwise immutable.
      operationId: purgeExtension
      parameters:
      - name: namespaceName
        in: path
        description: Namespace name
        required: true
        schema:
          type: string
        example: julialang
      - name: extensionName
        in: path
        description: Extension name
        required: true
        schema:
          type: string
        example: language-julia
      - name: token
        in: query
        description: A personal access token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
