        required: true
        schema:
          type: integer
          format: int64
        example: 123
      responses:
        '200':
          description: Scan details
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '404':
          description: Scan not found
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/filterOptions:
    get:
      tags:
      - scan-api
      summary: Get scan filter options
      operationId: getScanFilterOptions
      responses:
        '200':
          description: Lists of unique values usable for scan filtering
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanFilterOptions'
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/counts:
    get:
      tags:
      - scan-api
      summary: Get scan counts
      operationId: getScanCounts
      parameters:
      - name: dateStartedFrom
        in: query
        description: Filter scans started on or after this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: dateStartedTo
        in: query
        description: Filter scans started on or before this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: enforcement
        in: query
        description: Filter by enforcement status of threats/validations
        required: false
        schema:
          type: string
          default: all
          enum:
          - enforced
          - notEnforced
          - all
      - name: validationType
        in: query
        description: Filter by validation type (comma-separated for multiple values, e.g., NAME SQUATTING, BLOCKLIST, SECRET)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            example: NAME SQUATTING
      - name: threatScannerName
        in: query
        description: Filter by threat scanner name (comma-separated for multiple values).
        required: false
        style: form
        explode: false
