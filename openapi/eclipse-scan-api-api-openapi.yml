openapi: 3.2.0
info:
  termsOfService: https://www.eclipse.org/legal/termsofuse.php
  license:
    name: Eclipse Public License 2.0
    url: https://www.eclipse.org/legal/epl-2.0/
  version: '0.1'
  title: Eclipse Scan API
servers:
- url: https://open-vsx.org
  description: Generated server url
tags:
- name: scan-api
paths:
  /admin/scans/{scanId}/jobs/retry:
    post:
      tags:
      - scan-api
      summary: Retry all failed scanner jobs for a scan
      operationId: retryFailedScannerJobs
      parameters:
      - name: scanId
        in: path
        description: Scan ID
        required: true
        schema:
          type: integer
          format: int64
        example: 123
      responses:
        '200':
          description: Failed jobs re-queued; returns the updated scan in SCANNING state
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          description: Scan is not terminal or has no failed jobs to retry
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '404':
          description: Scan or scanner jobs were not found
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/decisions:
    post:
      tags:
      - scan-api
      summary: Make security decisions for quarantined scans
      operationId: makeScanDecisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanDecisionRequest'
        required: true
      responses:
        '200':
          description: Decisions processed successfully
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDecisionResponse'
        '400':
          description: Invalid request or scan not in quarantined status
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans:
    get:
      tags:
      - scan-api
      summary: Get all extension scans
      operationId: getAllScans
      parameters:
      - name: status
        in: query
        description: Filter by scan status (comma-separated for multiple values)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            example: QUARANTINED
            enum:
            - STARTED
            - VALIDATING
            - SCANNING
            - PASSED
            - QUARANTINED
            - AUTO REJECTED
            - ERROR
      - name: publisher
        in: query
        description: Filter by publisher name (partial matches supported)
        required: false
        schema:
          type: string
      - name: namespace
        in: query
        description: Filter by namespace (partial matches supported)
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filter by display name or extension name (partial matches supported)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: Maximal number of entries to return
        required: false
        schema:
          maximum: 100
          minimum: 0
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of entries to skip
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          type: string
          default: scanEndTime
          enum:
          - scanEndTime
          - scanStartTime
          - displayName
          - publisher
          - status
      - name: sortOrder
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: dateStartedFrom
        in: query
        description: Filter scans started on or after this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: dateStartedTo
        in: query
        description: Filter scans started on or before this date (ISO 8601 format)
        required: false
        schema:
          type: string
      - name: validationType
        in: query
        description: Filter by validation type (comma-separated for multiple values, e.g., NAME SQUATTING, BLOCKLIST, SECRET)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            example: NAME SQUATTING
      - name: threatScannerName
        in: query
        description: Filter by threat scanner name (comma-separated for multiple values).
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            example: ClamAV
      - name: enforcement
        in: query
        description: Filter by enforcement status of threats/validations
        required: false
        schema:
          type: string
          default: all
          enum:
          - enforced
          - notEnforced
          - all
      - name: adminDecision
        in: query
        description: Filter by admin decision status (comma-separated for multiple values). Use 'allowed' for scans with Allowed decision, 'blocked' for Blocked decision, 'needs-review' for scans with no decision yet.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - allowed
            - blocked
            - needs-review
      responses:
        '200':
          description: List of all scans
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanResult'
        '403':
          description: Administration role is required
          headers:
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
        '429':
          description: A client has sent too many requests in a given amount of time
          headers:
            X-RateLimit-Reset:
              description: Number of seconds until the rate limit tokens will be fully filled to its maximum
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Remaining number of requests left in the current time window
              schema:
                type: integer
                format: int32
            X-RateLimit-Limit:
              description: Number of requests that can be made in a given amount of time
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Number of seconds to wait after receiving a 429 response
              schema:
                type: integer
                format: int32
  /admin/scans/{scanId}:
